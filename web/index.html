<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena</title>
<style>
  /* A design system, because the agent is held to one and so is its console. */
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --panel-2: #1c1f26;
    --line: #262a33;
    --ink: #e6e8ec;
    --ink-dim: #9aa1ad;
    --ink-faint: #646c7a;
    --accent: #7dd3a0;
    --accent-dim: #2f5f45;
    --tool: #8ab4f8;
    --warn: #f0b866;
    --bad: #f08a8a;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.55 var(--sans);
    display: grid; grid-template-rows: auto 1fr;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand { font-weight: 650; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .meta { color: var(--ink-faint); font: 12px/1.4 var(--mono); display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--ink-dim); font-weight: 500; }
  .spacer { flex: 1; }

  button, select {
    font: 500 13px var(--sans); color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: #38404e; }
  button:focus-visible, select:focus-visible, textarea:focus-visible,
  .file:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #07120c; border-color: var(--accent); font-weight: 650; }
  button.danger { color: var(--bad); border-color: #4a2b2b; }

  main { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(400px, 1fr); overflow: hidden; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  .col { display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  /* The right column is tabs-then-pane, and a hidden pane leaves the grid
     entirely (display:none below), so two rows is always the right count. */
  .col.right { grid-template-rows: auto 1fr; }
  .col + .col { border-left: 1px solid var(--line); }

  /* ---- the feed ---- */
  #feed { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .block { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .block.user { background: var(--panel-2); border-color: #2e3846; }
  .block.user .body { color: var(--ink); }
  .head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 12px; background: none; border: 0; border-radius: 0;
    font: 500 13px var(--sans); color: var(--ink-dim); text-align: left;
  }
  .head .name { font-family: var(--mono); color: var(--tool); }
  .head .args { font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .head .ms { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .body { padding: 0 12px 11px; white-space: pre-wrap; word-break: break-word; }
  .body.mono { font: 12px/1.5 var(--mono); color: var(--ink-dim); }
  .label { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase;
           color: var(--ink-faint); padding: 9px 12px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .dot.run { background: var(--warn); animation: pulse 1s infinite; }
  .dot.ok { background: var(--accent); }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; } }
  .block.done { border-color: var(--accent-dim); }
  .block.error { border-color: #4a2b2b; }
  .block.error .body { color: var(--bad); }

  .approval { border-color: var(--warn); }
  .approval .row { display: flex; gap: 8px; padding: 0 12px 12px; }

  /* ---- composer ---- */
  .composer { border-top: 1px solid var(--line); padding: 12px; background: var(--panel); }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: 14px/1.5 var(--sans);
  }
  .composer .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .hint { color: var(--ink-faint); font-size: 12px; }

  /* ---- right pane ---- */
  .tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--ink); border-color: #38404e; }
  .pane { overflow: auto; height: 100%; }
  .pane[hidden] { display: none; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .files { padding: 8px; }
  .file { display: flex; gap: 10px; width: 100%; text-align: left; background: none;
          border: 0; border-radius: 6px; padding: 7px 10px; font-family: var(--mono); font-size: 12.5px; }
  .file:hover { background: var(--panel-2); }
  .file .size { color: var(--ink-faint); margin-left: auto; }
  pre.code { margin: 0; padding: 14px; font: 12px/1.6 var(--mono); color: var(--ink-dim); white-space: pre; }
  .empty { color: var(--ink-faint); padding: 24px; text-align: center; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="brand">Athena<span>.</span></div>
  <div class="meta">
    <span><b>model</b> <i id="m-model">…</i></span>
    <span><b>jail</b> <i id="m-jail">…</i></span>
  </div>
  <div class="spacer"></div>
  <select id="mode" title="Permission mode (applies to the next run)">
    <option value="yolo">yolo — never asks</option>
    <option value="safe">safe — asks first</option>
    <option value="read-only">read-only</option>
  </select>
  <button id="resume" title="Continue the newest session in this directory">Resume</button>
  <button id="reset">New session</button>
</header>

<main>
  <section class="col">
    <div id="feed"><div class="empty">Type what you want built. You will see every
      step it takes — the tools it calls, what came back, and how long each took.</div></div>
    <div class="composer">
      <textarea id="prompt" placeholder="Build a landing page for a coffee roaster in Goa — sticky nav, six origin cards with prices, an FAQ accordion, dark mode."></textarea>
      <div class="row">
        <button id="run" class="primary">Run</button>
        <button id="stop" class="danger" disabled>Stop</button>
        <span class="hint" id="status">idle</span>
      </div>
    </div>
  </section>

  <section class="col right">
    <div class="tabs">
      <button class="tab" id="t-preview" aria-selected="true">Preview</button>
      <button class="tab" id="t-files" aria-selected="false">Files</button>
      <div class="spacer"></div>
      <button id="refresh" title="Reload the preview">Reload</button>
    </div>
    <div class="pane" id="p-preview"><iframe id="frame" title="Preview"></iframe></div>
    <div class="pane" id="p-files" hidden>
      <div class="files" id="files"></div>
      <pre class="code" id="code"></pre>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const feed = $("feed");
let running = false, previewFile = "index.html", files = [];

/* ---------- rendering ---------------------------------------------------- */

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function atBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120; }
function scroll(was) { if (was) feed.scrollTop = feed.scrollHeight; }

function clearEmpty() { const e = feed.querySelector(".empty"); if (e) e.remove(); }

// Arguments, on one line, clipped — the same decision the CLI printer makes.
function summarise(args) {
  return Object.entries(args || {}).map(([k, v]) => {
    let s = String(v).replace(/\s+/g, " ");
    if (s.length > 70) s = s.slice(0, 70) + "…";
    return `${k}=${s}`;
  }).join(", ");
}

function addUser(text) {
  clearEmpty();
  const b = el("div", "block user");
  b.append(el("div", "label", "you"), el("div", "body", text));
  feed.append(b); feed.scrollTop = feed.scrollHeight;
}

function addAssistant(text) {
  if (!text) return;
  const was = atBottom();
  const b = el("div", "block");
  b.append(el("div", "label", "athena"), el("div", "body", text));
  feed.append(b); scroll(was);
}

// A tool call arrives before its result, so the block is created open-ended and
// completed in place when tool_end lands. That gap is the "thinking" you watch.
let openTool = null;
function addToolStart(ev) {
  clearEmpty();
  const was = atBottom();
  const b = el("div", "block");
  const head = el("button", "head");
  head.append(el("span", "dot run"), el("span", "name", ev.name),
              el("span", "args", summarise(ev.args)), el("span", "ms", "…"));
  const body = el("div", "body mono");
  body.hidden = true;
  head.onclick = () => { body.hidden = !body.hidden; };
  head.setAttribute("aria-expanded", "false");
  b.append(head, body);
  feed.append(b); scroll(was);
  openTool = { head, body };
}

function addToolEnd(ev) {
  const was = atBottom();
  const target = openTool;
  openTool = null;
  if (!target) return;
  const bad = /^(ERROR|BLOCKED)/.test(ev.result);
  target.head.querySelector(".dot").className = "dot " + (bad ? "bad" : "ok");
  target.head.querySelector(".ms").textContent = ev.ms >= 1000
    ? (ev.ms / 1000).toFixed(1) + "s" : ev.ms + "ms";
  target.body.textContent = ev.result + (ev.clipped ? "\n… clipped" : "");
  // Only errors open themselves. Everything else is one click away.
  if (bad) { target.body.hidden = false; target.head.setAttribute("aria-expanded", "true"); }
  scroll(was);
}

function addDone(ev) {
  const was = atBottom();
  const b = el("div", "block done");
  const secs = (ev.ms / 1000).toFixed(1);
  b.append(el("div", "label", ev.stopped ? `stopped after ${secs}s` : `done in ${secs}s`),
           el("div", "body", ev.text || "(no closing text)"));
  feed.append(b); scroll(was);
  refreshPreview();
}

function addError(message) {
  const b = el("div", "block error");
  b.append(el("div", "label", "error"), el("div", "body", message));
  feed.append(b); feed.scrollTop = feed.scrollHeight;
}

function addNote(text) {
  const b = el("div", "block");
  b.append(el("div", "body mono", text));
  feed.append(b); feed.scrollTop = feed.scrollHeight;
}

// safe mode: the run thread is blocked on this until a button is clicked.
function addApproval(ev) {
  const b = el("div", "block approval");
  b.dataset.approval = ev.id;
  b.append(el("div", "label", "approval needed"));
  const head = el("div", "head");
  head.append(el("span", "name", ev.name), el("span", "args", summarise(ev.args)));
  b.append(head);
  const row = el("div", "row");
  const yes = el("button", "primary", "Allow");
  const no = el("button", "danger", "Deny");
  yes.onclick = () => decide(ev.id, true);
  no.onclick = () => decide(ev.id, false);
  row.append(yes, no);
  b.append(row);
  feed.append(b); feed.scrollTop = feed.scrollHeight;
}

function decide(id, allow) {
  post("/api/approve", { id, allow });
  const b = feed.querySelector(`[data-approval="${CSS.escape(id)}"] .row`);
  if (b) b.replaceChildren(el("span", "hint", allow ? "allowed" : "denied"));
}

/* ---------- files and preview -------------------------------------------- */

function renderFiles(list) {
  files = list;
  const box = $("files");
  box.replaceChildren();
  if (!list.length) { box.append(el("div", "empty", "Nothing built yet.")); return; }
  for (const f of list) {
    const b = el("button", "file");
    b.append(el("span", "", f.path),
             el("span", "size", f.size >= 1024 ? (f.size / 1024).toFixed(1) + "KB" : f.size + "B"));
    b.onclick = () => openFile(f.path);
    box.append(b);
  }
  // Preview whichever page the agent is actually building.
  const html = list.find(f => f.path.endsWith("index.html")) || list.find(f => f.path.endsWith(".html"));
  if (html && html.path !== previewFile) { previewFile = html.path; refreshPreview(); }
}

async function openFile(path) {
  const r = await fetch("/api/file?path=" + encodeURIComponent(path)).then(r => r.json());
  $("code").textContent = r.ok ? r.text : "cannot read: " + r.error;
  $("code").scrollIntoView({ block: "nearest" });
}

function tab(name) {
  for (const which of ["preview", "files"]) {
    $("t-" + which).setAttribute("aria-selected", String(which === name));
    $("p-" + which).hidden = which !== name;
  }
}
$("t-preview").onclick = () => tab("preview");
$("t-files").onclick = () => tab("files");

function refreshPreview() {
  // The cache-buster is the point: the file changed under the same URL.
  $("frame").src = "/preview/" + encodeURI(previewFile) + "?t=" + Date.now();
}

/* ---------- wiring -------------------------------------------------------- */

function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(body || {}) }).then(r => r.json());
}

function setRunning(on) {
  running = on;
  $("run").disabled = on;
  $("stop").disabled = !on;
  $("status").textContent = on ? "working…" : "idle";
}

async function run() {
  const prompt = $("prompt").value.trim();
  if (!prompt || running) return;
  setRunning(true);
  const r = await post("/api/run", { prompt });
  if (!r.ok) { setRunning(false); addError(r.error || "a run is already going"); return; }
  $("prompt").value = "";
}

$("run").onclick = run;
$("stop").onclick = () => { $("status").textContent = "stopping…"; post("/api/stop"); };
$("reset").onclick = async () => { await post("/api/reset"); feed.replaceChildren(); };
$("resume").onclick = async () => {
  const r = await post("/api/resume");
  if (!r.ok) addNote("nothing to resume in this directory");
};
$("refresh").onclick = refreshPreview;
$("mode").onchange = (e) => post("/api/mode", { mode: e.target.value });

// Cmd/Ctrl-Enter runs, because the box is multi-line on purpose.
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
});

const HANDLERS = {
  user: (e) => addUser(e.text),
  assistant: (e) => addAssistant(e.text),
  tool_start: addToolStart,
  tool_end: addToolEnd,
  files: (e) => renderFiles(e.files),
  approval: addApproval,
  done: (e) => { addDone(e); setRunning(false); },
  error: (e) => { addError(e.message); setRunning(false); },
  stopping: () => { $("status").textContent = "stopping…"; },
  reset: () => { feed.replaceChildren(); },
  resumed: (e) => addNote(`resumed ${e.messages} messages from ${e.path}`),
  mode: (e) => { $("mode").value = e.mode; addNote("mode: " + e.mode); },
  approval_done: () => {},
};

const stream = new EventSource("/api/events");
stream.onmessage = (msg) => {
  const ev = JSON.parse(msg.data);
  const fn = HANDLERS[ev.type];
  if (fn) fn(ev);
};

fetch("/api/state").then(r => r.json()).then(s => {
  $("m-model").textContent = s.model;
  $("m-jail").textContent = s.workdir;
  $("mode").value = s.mode;
  document.title = "Athena — " + s.workdir.split("/").pop();
  renderFiles(s.files);
  setRunning(s.running);
});
</script>
</body>
</html>
